name: Rotation

on:
  pull_request:
    types: [opened, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET7
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: 7.0.x

      - name: Restore dependencies
        run: dotnet restore SpaceBattle.Lib

      - name: Build
        run: dotnet build SpaceBattle.Lib --no-restore /p:ContinuousIntegrationBuild=true
        
      - name: Coverage
        run: dotnet test SpaceBattle.Lib.Tests /p:CollectCoverage=true /p:CoverletOutput=TestResults/ddc7c36c-b7d6-423e-adb4-f8b835741cef/ /p:CoverletOutputFormat=lcov
        
      - name: Format
        run: dotnet format --verify-no-changes\